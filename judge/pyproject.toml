[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pseint-judge"
version = "0.1.0"
description = "Judge module for pseint-judge: verdict classification and submission runner"
requires-python = ">=3.11"
dependencies = ["pseint-engine"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
