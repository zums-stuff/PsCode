[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pseint-api"
version = "0.1.0"
description = "API layer for pseint-judge: persistence, auth, REST + WebSocket"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.0",
    "pwdlib[argon2]>=0.2",
    "fastapi>=0.110",
    "python-jose[cryptography]>=3.3",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated alembic revisions: long sa.Column lines + typing boilerplate
# are alembic conventions, not hand-written code.
"alembic/versions/*.py" = ["E501", "UP007", "UP035", "W291"]
